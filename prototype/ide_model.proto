//
// Vendor-owned tooling model, defined by the "IDE" that ships the plugin. Gradle does NOT
// know this schema; it only carries it inside a google.protobuf.Any. Both the daemon-side
// plugin and the native client are built from THIS file, so the client matches the Any
// type-url ("type.googleapis.com/com.example.ide.IdeProjectModel") and unpacks it.

syntax = "proto3";

package com.example.ide;

option java_multiple_files = true;
option java_package = "com.example.ide.proto";
option java_outer_classname = "IdeModelProto";

message IdeProjectModel {
  string project_path = 1;   // e.g. ":app"
  string project_name = 2;
  string build_dir = 3;      // absolute path
  repeated string plugin_ids = 4;   // plugins applied to the target project
}
