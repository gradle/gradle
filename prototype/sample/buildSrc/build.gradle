// buildSrc for the sample build: builds the "IDE" plugin that contributes a tooling model.
// protobuf-java is compileOnly: the Gradle runtime exports it to plugins, so the plugin's
// generated model shares one com.google.protobuf.Message class with the daemon. That lets the
// daemon Any.pack the returned message for native clients and the Tooling API adapt it for JVM
// clients - one builder serving both.
plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly gradleApi()
    // protobuf-java is provided by the Gradle runtime (exported to plugins), so the plugin's
    // generated model shares one com.google.protobuf.Message class with the daemon. compileOnly,
    // not implementation, so the plugin does not bundle its own copy.
    compileOnly 'com.google.protobuf:protobuf-java:3.21.12'
}
