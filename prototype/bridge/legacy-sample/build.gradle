// Tasks the bridge demo drives over gRPC against an old Gradle version.
tasks.register('hello') {
    doLast {
        println 'Hello from the bridged build!'
    }
}

tasks.register('boom') {
    doLast {
        throw new GradleException('Intentional failure for the bridge demo')
    }
}

tasks.register('sleeper') {
    doLast {
        println 'sleeper: running, waiting to be cancelled'
        // Classic Tooling API cancellation interrupts the build thread, so a plain sleep is enough.
        Thread.sleep(60000)
        println 'sleeper: finished without cancellation'
    }
}

// Echoes a system property and an environment variable so the client can see structured build
// configuration reaching a build the bridge drives on an old Gradle version.
tasks.register('printConfig') {
    def demoSys = providers.systemProperty('demo.sys')
    def demoEnv = providers.environmentVariable('DEMO_ENV')
    doLast {
        println 'demo.sys=' + demoSys.getOrElse('(unset)')
        println 'DEMO_ENV=' + demoEnv.getOrElse('(unset)')
    }
}

// Reads a line from standard input and echoes it, so a client can prove it fed the build's stdin.
tasks.register('readInput') {
    doLast {
        def line = new BufferedReader(new InputStreamReader(System.in)).readLine()
        println 'read: ' + line
    }
}

// Touches a deprecated API so Gradle reports a deprecation, which recent versions surface through the
// Problems API - letting a client see a ProblemEvent stream over gRPC.
tasks.register('deprecated') {
    doLast {
        println 'buildDir=' + project.buildDir
    }
}
