subprojects {

apply plugin: 'java'
apply plugin: 'eclipse'
apply plugin: 'idea'

repositories {
<% if (repository) { %>
    maven {
        url = rootProject.file("${repository.rootDir.name}")
    }
<% } %>
    mavenCentral()
}

dependencies {
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    implementation "org.apache.httpcomponents.client5:httpclient5:5.6.2"
    implementation "commons-codec:commons-codec:1.22.0"
    implementation "org.slf4j:jcl-over-slf4j:2.0.18"
    implementation "org.apache.groovy:groovy-all:4.0.32"
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.testng:testng:7.12.0'
    runtimeOnly 'com.esotericsoftware:reflectasm:1.11.9'

    <% if (dependencies) { dependencies.each { %>
        implementation "${it.shortNotation()}" <% } %>
    <% } %>
}

test {
    if (!JavaVersion.current().java8Compatible) {
        jvmArgs('-XX:MaxPermSize=512m')
    }
    jvmArgs('-XX:+HeapDumpOnOutOfMemoryError')
}

<% if (groovyProject) { %>
apply plugin: 'groovy'
dependencies {
    implementation 'org.apache.groovy:groovy-all:4.0.32'
}
<% } %>

<% if (scalaProject) { %>
apply plugin: 'scala'
dependencies {
    implementation 'org.scala-lang:scala-library:2.13.18'
}
tasks.withType(ScalaCompile) {
    scalaCompileOptions.with {
        useAnt = false
        fork = true
        if (!JavaVersion.current().java8Compatible) {
            forkOptions.jvmArgs = ["-XX:MaxPermSize=512m"]
        }
    }
}
<% } %>

task dependencyReport(type: DependencyReportTask) {
    outputFile = new File(buildDir, "dependencies.txt")
}
}
