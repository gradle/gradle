import groovy.json.JsonOutput

// Ignore buildSrc: measure the main build, with its task graph and properties still reachable.
if (gradle.parent == null) {
    long started = 0
    gradle.projectsLoaded { started = System.nanoTime() }
    gradle.taskGraph.whenReady { graph ->
        long configured = System.nanoTime()
        def sample = [configurationMs: (configured - started) / 1_000_000d,
                      pid: ProcessHandle.current().pid(), tasks: graph.allTasks.size(),
                      configuredProjects: gradle.rootProject.allprojects.size()]
        def histogram = gradle.startParameter.projectProperties.get('sampleHistogram')
        if (histogram != null) {
            // Default GC.class_histogram requests a full GC, unlike its -all form.
            def command = new File(System.getProperty('java.home'), 'bin/jcmd').absolutePath
            def process = new ProcessBuilder(command, sample.pid.toString(), 'GC.class_histogram')
                .redirectErrorStream(true).redirectOutput(new File(histogram)).start()
            if (process.waitFor() != 0) {
                throw new GradleException("Heap histogram failed; see $histogram")
            }
        }
        println('PROVENANCE_SAMPLE ' + JsonOutput.toJson(sample))
    }
}
