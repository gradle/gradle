// tag::do-this[]
def MY_FORMAT = Attribute.of("my-format", String) // <1>
dependencies.attributesSchema.attribute(MY_FORMAT)

def myElements = configurations.consumable("myElements") {
    attributes {
        attribute(MY_FORMAT, "json") // <2>
    }
}

tasks.register("printFormat") {
    def format = myElements.get().attributes.getAttribute(MY_FORMAT) // <3>
    doLast {
        logger.lifecycle("my-format = $format")
    }
}
// end::do-this[]
