// tag::avoid-this[]
interface MyFormat extends Named {} // <1>

def MY_FORMAT = Attribute.of("my-format", MyFormat)
dependencies.attributesSchema.attribute(MY_FORMAT)

def myElements = configurations.consumable("myElements") {
    attributes {
        attribute(MY_FORMAT, objects.named(MyFormat, "json")) // <2>
    }
}

tasks.register("printFormat") {
    def format = myElements.get().attributes.getAttribute(MY_FORMAT).name // <3>
    doLast {
        logger.lifecycle("my-format = $format")
    }
}
// end::avoid-this[]
