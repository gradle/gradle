commands: [{
    executable: gradle
    args: ":consumer:greet -Precipient=World"
    expected-output-file: greet.out
    allow-additional-output: true
}, {
    executable: gradle
    args: ":consumer:greet"
    flags: "--warning-mode=all"
    expected-output-file: greetWithoutRecipient.out
    allow-additional-output: true
}, {
    executable: gradle
    args: ":consumer:greet -Precipient=fail"
    expect-failure: true
    expected-output-file: greetFail.out
    allow-additional-output: true
}]
