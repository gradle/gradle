# The docs harness has no Maven settings.xml, so the mirror never applies and the
# repository the build declares cannot resolve. That is the point of the sample: this
# output is what you get without the mirror. MavenSettingsMirrorSampleIntegrationTest
# runs the same sample with the settings in place and asserts it resolves.
executable: gradle
args: dependencies --configuration runtimeClasspath -q
expected-output-file: dependencies.out
allow-additional-output: true
