# No distributionSha256Sum is set here, deviating from the "Validate the Gradle Distribution
# SHA-256 Checksum" best practice:
# https://docs.gradle.org/current/userguide/best_practices_security.html#validate_gradle_checksum
#
# This build bootstraps itself with a nightly or milestone distribution, which is re-pointed
# frequently (see the 'nightlyWrapper' task in gradlebuild.wrapper.gradle.kts). A pinned checksum
# would be stale on most bumps, and a checksum updated in the same automated step that moves the
# URL provides no independent verification. Integrity here rests on TLS to services.gradle.org
# plus validateDistributionUrl below. Builds consuming a released Gradle version should set it.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.9.0-milestone-2-bin.zip
networkTimeout=10000
retries=0
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
