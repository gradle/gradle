name: Upgrade to latest wrapper

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade-latest-wrapper:
    runs-on: ubuntu-latest

    if: github.repository == 'gradle/gradle'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: devprod/upgrade-to-latest-wrapper
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Setup java
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: 25
      - name: Update Gradle to latest nightly and push to devprod/upgrade-to-latest-wrapper
        run: |
          set -eu
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

          git reset origin/master --hard

          NIGHTLY=$(curl -fsSL https://services.gradle.org/versions/nightly)
          NIGHTLY_VERSION=$(echo "$NIGHTLY" | jq -er '.version')
          NIGHTLY_CHECKSUM=$(echo "$NIGHTLY" | jq -er '.checksum')

          ./gradlew :wrapper --gradle-version="$NIGHTLY_VERSION" --gradle-distribution-sha256-sum="$NIGHTLY_CHECKSUM"
          ./gradlew :wrapper

          if ! git diff --quiet; then
            ./gradlew -v
            VERSION=$(./gradlew -v | grep "Gradle" | cut -d' ' -f2)
            git add .
            git commit -m "Update Gradle wrapper to $VERSION"
            git push --force origin devprod/upgrade-to-latest-wrapper
          else
            echo "No changes to commit"
          fi
